[project]
name = "frameforge"
version = "0.1.0"
description = "Multi-process camera acquisition pipeline for home-cage rodent monitoring"
requires-python = ">=3.13"
dependencies = [
    "pypylon",
    "smbprotocol",
    "prometheus-client",
    "pyyaml",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
python-preference = "only-managed"
