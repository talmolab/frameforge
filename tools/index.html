<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frameforge fleet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%278%27%20fill%3D%27%23f97316%27%2F%3E%3Cg%20transform%3D%27translate%284%204%29%27%20fill%3D%27none%27%20stroke%3D%27%23fff%27%20stroke-width%3D%272.5%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Cpath%20d%3D%27m15%2012-8.5%208.5c-.83.83-2.17.83-3%200a2.12%202.12%200%200%201%200-3L12%209%27%2F%3E%3Cpath%20d%3D%27M17.64%2015%2022%2010.64%27%2F%3E%3Cpath%20d%3D%27m20.91%2011.7-1.25-1.25c-.6-.6-.93-1.4-.93-2.25v-.86L16.01%204.6a5.56%205.56%200%200%200-3.94-1.64H9l.92.82A6.18%206.18%200%200%201%2012%208.4v1.56l2%202h.86c.85%200%201.65.33%202.25.93l1.25%201.25%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
 *{box-sizing:border-box}
 body{margin:0;min-height:100vh;color:#f0e9e0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:radial-gradient(1100px 520px at 50% -14%,#3a1e08,#180f08 60%)}
 body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
      background:radial-gradient(600px 300px at 20% 0%,rgba(239,68,68,.18),transparent 60%),
                 radial-gradient(700px 340px at 85% 4%,rgba(249,115,22,.16),transparent 60%);
      animation:ember 9s ease-in-out infinite alternate}
 @keyframes ember{from{opacity:.7}to{opacity:1}}
 .lava{position:fixed;left:0;right:0;bottom:0;height:20px;z-index:5;pointer-events:none;
       background:linear-gradient(180deg,rgba(122,26,5,0),#7a1a05 45%,#ef4444);box-shadow:0 -6px 24px rgba(239,68,68,.5)}
 .lava i{position:absolute;bottom:8px;width:var(--s,13px);height:var(--s,13px);border-radius:50%;
       background:radial-gradient(circle at 35% 30%,#fde68a,#f97316 46%,#ef4444);box-shadow:0 0 10px rgba(249,115,22,.7);
       animation:bubble var(--d,4s) ease-in var(--t,0s) infinite}
 @keyframes bubble{0%{transform:translateY(0) scale(.3);opacity:0}18%{opacity:.95}70%{transform:translateY(-26px) scale(1);opacity:.9}100%{transform:translateY(-44px) scale(1.12);opacity:0}}
 a{color:inherit;text-decoration:none}
 .wrap{max-width:1140px;margin:0 auto;padding:28px 24px 60px}
 .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
 .brand{display:flex;align-items:center;gap:12px}
 .logo{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;color:#fff;
       background:linear-gradient(160deg,#fb923c,#ea580c);box-shadow:0 6px 20px rgba(249,115,22,.4)}
 .logo svg{width:23px;height:23px}
 h1{margin:0;font-size:25px;letter-spacing:-.02em}
 h1 .fg{background:linear-gradient(90deg,#fb923c,#ef4444);-webkit-background-clip:text;background-clip:text;color:transparent}
 .sub{color:#b7a894;font-size:13px;margin:3px 0 0}
 .tools{display:flex;gap:8px;align-items:center}
 .back{color:#fb923c;font-size:14px;display:inline-block;margin-bottom:14px}
 .back:hover{text-decoration:underline}
 .btn{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
 .btn:hover{filter:brightness(1.12)}
 .btn.g{background:linear-gradient(160deg,#fb923c,#ea580c)} .btn.agg{background:#8b5cf6} .btn.ghost{background:#2a1c11;border:1px solid #4a3722}
 .summary{color:#d8cbb8;font-size:13.5px}
 .summary b{font-size:15px}
 .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:6px}
 .card{background:linear-gradient(180deg,#241a10,#1c150d);border:1px solid #3f2d1a;border-radius:14px;padding:16px 18px;transition:.15s;display:block}
 .card:hover{border-color:#f97316;transform:translateY(-1px)}
 .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
 .name{font-size:18px;font-weight:700}
 .meta{color:#b7a894;font-size:13px;margin-top:3px}
 .pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap}
 .pill::before{content:"";width:8px;height:8px;border-radius:50%}
 .pill.ok{background:rgba(74,222,128,.15);color:#4ade80}   .pill.ok::before{background:#4ade80}
 .pill.warn{background:rgba(251,191,36,.16);color:#fbbf24} .pill.warn::before{background:#fbbf24}
 .pill.down{background:rgba(248,113,113,.16);color:#f87171}.pill.down::before{background:#f87171}
 .pill.idle{background:rgba(148,132,110,.18);color:#c9b79f}.pill.idle::before{background:#c9b79f}
 .mini{display:flex;gap:22px;margin-top:13px}
 .mini div{font-size:12px;color:#b7a894} .mini b{display:block;color:#f0e9e0;font-size:17px;margin-top:1px}
 .panel{background:linear-gradient(180deg,#241a10,#1c150d);border:1px solid #3f2d1a;border-radius:14px;padding:18px 20px;margin:0 0 16px}
 .panel h2{margin:0 0 14px;font-size:13px;font-weight:700;color:#cbb79b;letter-spacing:.06em;text-transform:uppercase}
 .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
 .stat{background:#17100a;border:1px solid #362617;border-radius:11px;padding:12px 14px}
 .stat .k{color:#b7a894;font-size:12px} .stat .v{font-size:22px;font-weight:750;margin-top:4px}
 .stat.warn .v{color:#fbbf24} .stat.down .v{color:#f87171}
 .grid{display:flex;flex-wrap:wrap;gap:10px}
 .wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-top:6px}
 .tile{position:relative;background:#000;border:1px solid #3f2d1a;border-radius:12px;overflow:hidden}
 .tile iframe{display:block;width:100%;aspect-ratio:5/4;border:0;background:#000}
 .tile .cap{position:absolute;top:8px;left:10px;z-index:2;background:rgba(24,15,8,.75);padding:3px 9px;border-radius:7px;font-size:12px;font-weight:600}
 .empty{text-align:center;padding:70px 20px;color:#b7a894}
 .empty .big{font-size:46px;margin-bottom:10px}
 .err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);color:#fca5a5;border-radius:10px;padding:10px 14px;margin:12px 0;font-size:13.5px}
 .note{color:#b7a894;font-size:12.5px;margin-top:10px}
 .foot{color:#7a6a56;font-size:12px;margin-top:28px;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<input type="file" id="picker" webkitdirectory directory multiple hidden>

<div class="lava" aria-hidden="true">
 <i style="left:6%;--s:12px;--d:4.2s;--t:.2s"></i><i style="left:14%;--s:9px;--d:3.4s;--t:1.1s"></i>
 <i style="left:23%;--s:16px;--d:5s;--t:.6s"></i><i style="left:33%;--s:10px;--d:3.8s;--t:1.7s"></i>
 <i style="left:43%;--s:13px;--d:4.6s;--t:.9s"></i><i style="left:52%;--s:8px;--d:3.2s;--t:2.1s"></i>
 <i style="left:61%;--s:15px;--d:5.2s;--t:.4s"></i><i style="left:70%;--s:11px;--d:4s;--t:1.4s"></i>
 <i style="left:80%;--s:9px;--d:3.6s;--t:.7s"></i><i style="left:90%;--s:14px;--d:4.8s;--t:1.9s"></i>
</div>

<script>
const PROM = 9090, GRAFANA = 3000, WEBRTC = 8889;
const DASH = "/d/frameforge-per-box/frameforge-e28094-per-box?orgId=1&from=now-24h&to=now&timezone=browser&var-cam=$__all&refresh=30s";
const LIVE = location.protocol === "http:";   // https can't fetch/embed http boxes (mixed content)
const app = document.getElementById("app");
const picker = document.getElementById("picker");
const state = { boxes: [], data: {}, err: null, view: "landing", ip: null, folder: null };
const STORE = "ff_fleet";
function saveStore(){ try { localStorage.setItem(STORE, JSON.stringify({ folder: state.folder, boxes: state.boxes })); } catch (_) {} }
const HAMMER = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 12-8.5 8.5c-.83.83-2.17.83-3 0a2.12 2.12 0 0 1 0-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 11.7-1.25-1.25c-.6-.6-.93-1.4-.93-2.25v-.86L16.01 4.6a5.56 5.56 0 0 0-3.94-1.64H9l.92.82A6.18 6.18 0 0 1 12 8.4v1.56l2 2h.86c.85 0 1.65.33 2.25.93l1.25 1.25"/></svg>`;

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const disp = (v, u) => v == null ? "&mdash;" : (u === "h" || u === "GB" ? v.toFixed(1) + " " + u : u === "%" ? Math.round(v) + "%" : String(Math.round(v)));
function age(ts){ const s = (Date.now() - Date.parse(ts)) / 1000; if (isNaN(s)) return "?"; if (s < 120) return Math.round(s) + "s ago"; if (s < 7200) return Math.round(s/60) + "m ago"; return Math.round(s/3600) + "h ago"; }

async function q(ip, expr){
  try{
    const r = await fetch(`http://${ip}:${PROM}/api/v1/query?query=` + encodeURIComponent(expr), { signal: AbortSignal.timeout(2500) });
    const res = (await r.json()).data.result;
    return res.length ? parseFloat(res[0].value[1]) : 0;
  }catch(e){ return null; }
}
async function cams(ip){
  try{
    const r = await fetch(`http://${ip}:${PROM}/api/v1/query?query=acq_camera_alive`, { signal: AbortSignal.timeout(2500) });
    return (await r.json()).data.result
      .map(m => ({ cam: m.metric.cam || "?", alive: parseFloat(m.value[1]) >= 1 }))
      .sort((a, b) => a.cam < b.cam ? -1 : 1);
  }catch(e){ return null; }
}
async function fetchBox(ip){
  const [up, disk, mem, cpu, cs] = await Promise.all([
    q(ip, "frameforge_uptime_seconds/3600"), q(ip, "transfer_free_mb/1024"),
    q(ip, "host_mem_available_mb/1024"), q(ip, "host_cpu_busy_ratio*100"), cams(ip),
  ]);
  const reachable = up != null;
  const live = cs ? cs.filter(c => c.alive).length : 0, total = cs ? cs.length : 0;
  const status = !reachable ? "down"
    : (live === 0 || (disk != null && disk < 20) || (cpu != null && cpu > 85)) ? "warn" : "ok";
  return { ip, up, disk, mem, cpu, cs, reachable, live, total, status };
}

function pill(box){
  const d = state.data[box.ip];
  if (!LIVE) return `<span class="pill idle">launcher</span>`;
  if (!d) return `<span class="pill idle">…</span>`;
  return `<span class="pill ${d.status}">${{ok:"OK",warn:"ATTENTION",down:"OFFLINE"}[d.status]}</span>`;
}
function card(box){
  const d = state.data[box.ip] || {};
  const camS = !LIVE ? "&mdash;" : (d.total ? `${d.live}/${d.total}` : "&mdash;");
  return `<a class="card" href="#/box/${encodeURIComponent(box.ip)}">
    <div class="row"><span class="name">${esc(box.hostname)}</span>${pill(box)}</div>
    <div class="meta">${esc(box.ip)} &middot; seen ${age(box.ts)}</div>
    <div class="mini">
      <div>Uptime<b>${disp(d.up, "h")}</b></div>
      <div>Cameras<b>${camS} live</b></div>
      <div>Scratch<b>${disp(d.disk, "GB")}</b></div>
    </div></a>`;
}

function renderLanding(){
  if (!state.boxes.length){
    app.innerHTML = header("") + (state.err ? `<div class="err">${esc(state.err)}</div>` : "") + `
      <div class="empty"><div class="big">🔨 📷</div>
      <p>Point at the <b>_ff_heartbeat</b> folder inside your recordings root to load the fleet.</p>
      <button class="btn g" onclick="picker.click()">Choose heartbeat folder</button>
      <p class="note">Reads the beacon <code>*.json</code> locally — nothing is uploaded.
      ${LIVE ? "" : "<br>Live metrics &amp; the camera wall need an <b>http</b> page; on https this runs as a launcher."}</p>
      </div>` + foot();
    return;
  }
  const c = { ok: 0, warn: 0, down: 0 };
  state.boxes.forEach(b => { const d = state.data[b.ip]; if (LIVE && d) c[d.status]++; });
  const summary = LIVE
    ? `${state.boxes.length} boxes &middot; <b style="color:#4ade80">${c.ok}</b> healthy &middot; <b style="color:#fbbf24">${c.warn}</b> attention &middot; <b style="color:#f87171">${c.down}</b> offline`
    : `${state.boxes.length} boxes &middot; launcher mode (open over http for live metrics)`;
  app.innerHTML = header(summary) + `<div class="cards">${state.boxes.map(card).join("")}</div>` + foot();
}

async function renderBox(ip){
  const box = state.boxes.find(b => b.ip === ip);
  const keys = [["up","Uptime","h"],["live","Cameras live",""],["disk","Scratch free","GB"],["mem","Host mem","GB"],["cpu","CPU busy","%"]];
  const tiles = keys.map(([k]) => `<div class="stat" id="st-${k}"><div class="k"></div><div class="v">&mdash;</div></div>`).join("");
  app.innerHTML = `<a class="back" href="#/">&larr; fleet</a>
    <div class="top"><div class="brand"><span class="logo">${HAMMER}</span>
      <div><h1>${esc(box.hostname)}</h1><p class="sub">${esc(ip)}</p></div></div>${pill(box)}</div>
    <div class="panel"><h2>Overview</h2><div class="stats">${tiles}</div>
      <div class="grid" style="margin-top:16px;justify-content:center">
        <a class="btn g" href="http://${ip}:${GRAFANA}${DASH}" target="_blank">Open full dashboard &rarr;</a></div></div>
    <div class="panel"><h2>📷 Live cameras</h2><div id="wall"></div></div>` + foot();
  keys.forEach(([k, label]) => app.querySelector(`#st-${k} .k`).textContent = label);
  const wall = app.querySelector("#wall");
  if (!LIVE){ wall.innerHTML = `<p class="note">Camera wall needs an http page (run this locally). Over https, open Grafana above or a camera directly.</p>`; return; }
  const cs = await cams(ip);
  if (!cs || !cs.length){ wall.innerHTML = `<p class="note">No cameras reporting (box unreachable?).</p>`; return; }
  wall.className = "wall";
  wall.innerHTML = cs.map(c => `<div class="tile"><span class="cap">${esc(c.cam)}</span>
    <iframe src="http://${ip}:${WEBRTC}/${encodeURIComponent(c.cam)}" allow="autoplay" allowfullscreen></iframe></div>`).join("");
}
function updateBoxStats(d){
  const set = (k, v, cls) => { const el = app.querySelector(`#st-${k}`); if (!el) return; el.querySelector(".v").innerHTML = v; el.className = "stat" + (cls ? " " + cls : ""); };
  set("up", disp(d.up, "h"));
  set("live", d.total ? `${d.live}/${d.total}` : "&mdash;", d.live === 0 ? "warn" : "");
  set("disk", disp(d.disk, "GB"), d.disk != null && d.disk < 20 ? "warn" : "");
  set("mem", disp(d.mem, "GB"));
  set("cpu", disp(d.cpu, "%"), d.cpu != null && d.cpu > 85 ? "warn" : "");
  const p = app.querySelector(".top .pill"); if (p) p.outerHTML = pill({ ip: d.ip });
}

const header = s => `<div class="top"><div class="brand"><span class="logo">${HAMMER}</span>
    <div><h1>frame<span class="fg">forge</span> fleet</h1><p class="sub summary">${s || "the forge, watched"}</p></div></div>
  <div class="tools"><button class="btn ghost" onclick="picker.click()">${state.folder ? "📁 " + esc(state.folder) : "Choose folder"}</button></div></div>`;
const foot = () => `<p class="foot">🔨 forge fleet console &middot; ${LIVE ? "live" : "launcher"} mode &middot; beacons read locally</p>`;

picker.addEventListener("change", async e => {
  const files = [...e.target.files].filter(f => f.name.endsWith(".json"));
  const bs = [];
  for (const f of files){
    try{ const b = JSON.parse(await f.text()); if (b.hostname && b.ip) bs.push({ hostname: b.hostname, ip: b.ip, ts: b.timestamp }); }catch(_){}
  }
  state.folder = e.target.files[0]?.webkitRelativePath.split("/")[0] || null;
  state.boxes = bs.sort((a, b) => a.hostname < b.hostname ? -1 : 1);
  state.data = {};
  state.err = bs.length ? null : "No beacon .json files found in that folder.";
  saveStore();
  if (location.hash !== "#/") location.hash = "#/"; else route();
  poll();
});

async function poll(){
  if (!LIVE || !state.boxes.length) return;
  if (state.view === "landing"){
    await Promise.all(state.boxes.map(async b => { state.data[b.ip] = await fetchBox(b.ip); }));
    if (state.view === "landing") renderLanding();
  } else if (state.view === "box" && state.ip){
    const d = await fetchBox(state.ip);
    state.data[state.ip] = d;
    if (state.view === "box" && state.ip === d.ip) updateBoxStats(d);
  }
}
function route(){
  const m = location.hash.match(/^#\/box\/(.+)$/);
  if (m && state.boxes.some(b => b.ip === decodeURIComponent(m[1]))){ state.view = "box"; state.ip = decodeURIComponent(m[1]); renderBox(state.ip); }
  else { state.view = "landing"; state.ip = null; renderLanding(); }
  if (LIVE && state.boxes.length) poll();
}
try { const s = JSON.parse(localStorage.getItem(STORE) || "null"); if (s && s.boxes) { state.boxes = s.boxes; state.folder = s.folder || null; } } catch (_) {}
window.addEventListener("hashchange", route);
setInterval(poll, 15000);
route();
</script>
</body>
</html>
