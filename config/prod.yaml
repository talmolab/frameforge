# frameforge — production profile (skeleton; not runnable until x86 backend lands).
# Selected with FF_PROFILE=prod. Override individual values via FF_* env vars.

cameras:
  - id: cam_05
  - id: cam_06
  - id: cam_07
  - id: cam_08

encode:
  backend: hevc_qsv         # placeholder — Intel QuickSync H.265 backend not yet implemented
  bitrate_mbps: 1
  fps: 50
  gop: 250

transfer:
  smb_server: pool1.vast.salk.edu
  smb_share: talmo
  smb_root: cdracos/HCM_Sync/talmolab    # real production tree; replace with the right path

scratch_dir: /var/lib/frameforge/scratch
