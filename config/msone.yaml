# frameforge — MS-01 first-light profile.
# Selected with FF_PROFILE=msone. Override paths via env: FF_SCRATCH, FF_LOG_DIR.

encode:
  backend: libx264
  fps: 50
  gop: 250
  crf: 21
  preset: superfast
  chunk_seconds: 600

transfer:
  smb_server: pool1.vast.salk.edu
  smb_share: talmo
  smb_root: cdracos/frameforge_test
  analytics: true

broadcast:
  enabled: true
  backend: hevc_qsv
  bitrate_mbps: 1.0
  rtsp_host: 127.0.0.1
  rtsp_port: 8554

cameras:
  - id: cam_08
