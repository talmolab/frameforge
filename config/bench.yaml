# frameforge — minimal Jetson config. Code defaults cover everything else.
# Override paths via env: FF_VAST_DEST, FF_SCRATCH, FF_LOG_DIR.

encode:
  backend: nvv4l2h265enc
  bitrate_mbps: 0.5
  chunk_seconds: 600

transfer:
  analytics: true

broadcast:
  enabled: false

cameras:
  - id: cam_08
    # serial: ""                          # blank/omitted = first device found
    # pfs: /etc/frameforge/cam_08.pfs     # optional pylon feature-stream file
